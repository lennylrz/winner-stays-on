<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Winner-stays-on ping pong with a live Elo ladder.">
<meta name="theme-color" content="#0B1830">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230B1830'/><circle cx='32' cy='32' r='15' fill='%23F47A20'/><circle cx='27' cy='27' r='4' fill='%23FFD9BC'/></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Winner Stays On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: phone-first single column, 640px max. A navy arena band carries the brand and tabs. On the Tables tab a full-bleed court floor holds a true-proportion table (274 x 152.5 cm, net posts overhanging 15.25 cm) with the ball resting on the side that holds the table. Lists sit quietly below on a cool neutral. */
:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --sunk:#E3E8F0;
  --ink:#0E1A2E;
  --ink-2:#43526A;
  --muted:#5B6980;
  --line:#D4DBE6;
  --arena:#0B1830;
  --arena-2:#172A4D;
  --arena-ink:#FFFFFF;
  --arena-soft:rgba(255,255,255,.7);
  --arena-line:rgba(255,255,255,.12);
  --floor:#5A2328;
  --floor-hi:#722F37;
  --floor-ink:#FFFFFF;
  --floor-soft:rgba(255,255,255,.76);
  --table:#1F4F98;
  --table-edge:#11306A;
  --table-line:#F4F7FB;
  --table-soft:rgba(255,255,255,.8);
  --net:#081122;
  --ball:#F47A20;
  --ball-ink:#1B0E04;
  --card:#F8F8F4;
  --card-lo:#E7E7E1;
  --card-ink:#101318;
  --series:#1F4F98;
  --win:#15805A;
  --loss:#BE3F2E;
  --live:#FF5A4E;
  --free:#3DDC97;
  --scrim:rgba(8,16,30,.5);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090F1A;--surface:#111A29;--sunk:#0D1522;--ink:#E7ECF5;--ink-2:#A8B4C8;--muted:#8392AA;--line:#22304A;
    --arena:#050B16;--arena-2:#13213D;--arena-ink:#FFFFFF;--arena-soft:rgba(255,255,255,.7);--arena-line:rgba(255,255,255,.1);
    --floor:#2B1114;--floor-hi:#41191F;--floor-ink:#FFFFFF;--floor-soft:rgba(255,255,255,.74);
    --table:#1D57AE;--table-edge:#0E2A5C;--table-line:#E9EFF8;--table-soft:rgba(255,255,255,.8);--net:#03070E;
    --ball:#FF8A3D;--ball-ink:#1B0E04;--card:#F1F1EC;--card-lo:#DEDED8;--card-ink:#101318;
    --series:#6FA2EE;--win:#43C38A;--loss:#F27464;--live:#FF6B5F;--free:#4BE3A2;--scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090F1A;--surface:#111A29;--sunk:#0D1522;--ink:#E7ECF5;--ink-2:#A8B4C8;--muted:#8392AA;--line:#22304A;
  --arena:#050B16;--arena-2:#13213D;--arena-ink:#FFFFFF;--arena-soft:rgba(255,255,255,.7);--arena-line:rgba(255,255,255,.1);
  --floor:#2B1114;--floor-hi:#41191F;--floor-ink:#FFFFFF;--floor-soft:rgba(255,255,255,.74);
  --table:#1D57AE;--table-edge:#0E2A5C;--table-line:#E9EFF8;--table-soft:rgba(255,255,255,.8);--net:#03070E;
  --ball:#FF8A3D;--ball-ink:#1B0E04;--card:#F1F1EC;--card-lo:#DEDED8;--card-ink:#101318;
  --series:#6FA2EE;--win:#43C38A;--loss:#F27464;--live:#FF6B5F;--free:#4BE3A2;--scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.locked,.locked body{overflow:hidden}
button,input{font:inherit;color:inherit}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* arena header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--arena);color:var(--arena-ink);border-bottom:1px solid var(--arena-line)}
.brand{display:flex;align-items:center;gap:10px;padding-block:14px 2px;min-height:58px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.mode{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.live i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:380px){.brand h1{font-size:24px}.live .lt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}}
@media (max-width:340px){.brand h1{font-size:21px}}
.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:var(--arena-2);color:var(--arena-soft);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.hdr-btn{appearance:none;border:1px solid var(--arena-line);background:var(--arena-2);color:var(--arena-ink);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.hdr-btn:hover{border-color:var(--arena-soft)}
.acct{appearance:none;border:1px solid var(--arena-line);width:32px;height:32px;border-radius:50%;background:var(--arena-2);color:var(--arena-ink);font-weight:700;font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0}
.tabs{display:flex;margin-top:2px}
.tab{flex:1;appearance:none;border:0;background:none;padding:12px 6px 14px;font-weight:600;font-size:14px;color:var(--arena-soft);cursor:pointer;position:relative}
.tab:hover{color:var(--arena-ink)}
.tab[aria-selected="true"]{color:var(--arena-ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:28%;right:28%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ball)}
.ball{display:inline-block;width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--ball) 25%,#fff) 0 14%,var(--ball) 46%,color-mix(in srgb,var(--ball) 72%,#000) 100%)}

/* type and layout */
main{padding-bottom:72px}
.view{display:grid;gap:26px}
.pad{padding-top:22px}
.stack{display:grid;gap:12px}
.stack.tight{gap:4px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
h2{margin:0;font-family:var(--display);font-weight:800;font-size:25px;line-height:1;letter-spacing:.025em;text-transform:uppercase;text-wrap:balance}
h3{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--win)}
.down{color:var(--loss)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap;align-items:flex-end}
.grow{flex:1;min-width:0}

/* controls */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;line-height:1.1;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--loss)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.btn svg{width:17px;height:17px;flex:none}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink-2);width:38px;height:38px;border-radius:9px;display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.spacer{visibility:hidden}
:where(button,[tabindex],input,summary,label,a):focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);cursor:pointer;padding:2px;width:fit-content}
.toggle input{width:20px;height:20px;accent-color:var(--ball);margin:0;flex:none}
.settings{display:grid;gap:10px;padding-top:2px}
.input{appearance:none;width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.input::placeholder{color:var(--muted)}
.input:focus{border-color:var(--ball);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ball) 25%,transparent)}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.err{color:var(--loss);font-size:13px;margin:0}

/* flip-scoreboard digits */
.flip{display:inline-flex;gap:.08em;vertical-align:middle}
.fd{position:relative;display:inline-grid;place-items:center;min-width:.66em;height:1.16em;padding:0 .07em;border-radius:.12em;background:linear-gradient(180deg,var(--card) 0 50%,var(--card-lo) 50% 100%);color:var(--card-ink);font-family:var(--display);font-weight:800;line-height:1;box-shadow:0 0 0 1px rgba(10,20,40,.16),0 .06em .12em rgba(10,20,40,.32)}
.fd::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:rgba(0,0,0,.26)}

/* court */
.court{background:radial-gradient(130% 80% at 50% 62%,var(--floor-hi) 0%,var(--floor) 70%);color:var(--floor-ink);padding-block:22px 30px}
.court-in{display:grid;gap:14px}
.court-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.len-chip{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:var(--floor-ink);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600;font-size:13px;cursor:pointer}
.len-chip .flip{font-size:17px}
.len-chip:hover{background:rgba(255,255,255,.15)}
.len-chip.static{cursor:default}
.len-chip.static:hover{background:rgba(255,255,255,.08)}
.court .hint{margin:0;text-align:center;font-size:13.5px;color:var(--floor-soft)}

/* the table */
.table-zone{position:relative;padding-block:6% 9%}
.ttable{position:relative;width:100%;aspect-ratio:274/152.5;z-index:0}
.surface{position:absolute;inset:0;border-radius:4px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,0) 38%,rgba(0,0,0,.1) 100%),var(--table);box-shadow:inset 0 0 0 3px var(--table-line)}
.apron{position:absolute;left:0;right:0;top:100%;height:9px;border-radius:0 0 5px 5px;background:linear-gradient(var(--table-edge),color-mix(in srgb,var(--table-edge) 70%,#000))}
.floor-shadow{position:absolute;left:-3%;right:-3%;top:calc(100% + 2px);height:36px;background:radial-gradient(closest-side,rgba(0,0,0,.5),rgba(0,0,0,0));z-index:-1;pointer-events:none}
.halves{position:absolute;inset:3px;display:grid;grid-template-columns:1fr 1fr;z-index:2}
.net-shadow{position:absolute;z-index:3;top:3px;bottom:3px;left:calc(50% + 2px);width:18px;background:linear-gradient(90deg,rgba(0,0,0,.26),rgba(0,0,0,0));pointer-events:none}
.net{position:absolute;z-index:4;left:calc(50% - 2px);width:4px;top:-10%;bottom:-10%;pointer-events:none}
.net::before{content:"";position:absolute;left:0;right:0;top:10%;bottom:10%;background:linear-gradient(90deg,var(--net) 0 1px,var(--table-line) 1px 3px,var(--net) 3px 4px)}
.net::after{content:"";position:absolute;left:-2px;right:-2px;top:0;bottom:0;border-radius:2px;background:linear-gradient(var(--net) 0 10%,transparent 10% 90%,var(--net) 90% 100%)}
.half{position:relative;min-width:0;display:flex}
.half-btn{appearance:none;border:0;background:transparent;color:var(--table-ink);flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 10px;text-align:center;border-radius:3px;transition:background-color .15s,opacity .15s}
button.half-btn{cursor:pointer}
button.half-btn:hover{background:rgba(255,255,255,.06)}
button.half-btn:focus-visible{outline:3px solid var(--ball);outline-offset:-6px}
.half.picked .half-btn{background:rgba(255,255,255,.1)}
.half.dim .half-btn{opacity:.45}
.h-eyebrow{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--table-soft);line-height:1.2}
.h-name{font-family:var(--display);font-weight:800;font-size:34px;line-height:.92;text-transform:uppercase;letter-spacing:.01em;max-width:100%;overflow-wrap:anywhere;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.h-name.long{font-size:26px}
.h-name.xlong{font-size:20px}
.h-rating{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.h-odds{font-size:11.5px;color:var(--table-soft);font-variant-numeric:tabular-nums;line-height:1.25}
.h-streak{margin-top:2px;padding:2px 9px;border-radius:999px;background:var(--ball);color:var(--ball-ink);font-size:11px;font-weight:700;letter-spacing:.02em}
.h-wait{font-size:13px;color:var(--table-soft);max-width:15ch;line-height:1.3}
.on-table{appearance:none;border:1px solid var(--table-line);background:transparent;color:var(--table-ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;margin-top:4px}
.on-table:hover{background:rgba(255,255,255,.12)}
.stepoff{position:absolute;top:4px;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--table-soft);display:grid;place-items:center;cursor:pointer;z-index:6}
.stepoff:hover{background:rgba(255,255,255,.14);color:var(--table-ink)}
.stepoff svg{width:16px;height:16px}
.half.a .stepoff{left:4px}
.half.b .stepoff{right:4px}
.ballbox{position:absolute;z-index:5;top:7%;left:46%;width:15px;height:15px;margin-left:-7.5px;pointer-events:none}
.ballbox.at-b{left:54%}
.ballbox .bs{position:absolute;left:3px;top:8px;width:16px;height:9px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0))}
.ballbox .bb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--ball) 25%,#fff) 0 14%,var(--ball) 46%,color-mix(in srgb,var(--ball) 72%,#000) 100%)}
.ballbox.fly-ab{animation:ab .62s cubic-bezier(.3,.1,.3,1) var(--d,0ms) both}
.ballbox.fly-ba{animation:ba .62s cubic-bezier(.3,.1,.3,1) var(--d,0ms) both}
.ballbox[class*="fly-"] .bb{animation:hop .62s linear var(--d,0ms) both}
.ballbox[class*="fly-"] .bs{animation:hopshadow .62s linear var(--d,0ms) both}
@keyframes ab{from{left:46%}to{left:54%}}
@keyframes ba{from{left:54%}to{left:46%}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-26px) scale(1.55)}76%{transform:translateY(0) scale(1)}88%{transform:translateY(-5px) scale(1.08)}100%{transform:none}}
@keyframes hopshadow{0%{opacity:1;transform:scale(1)}40%{opacity:.3;transform:scale(.65)}76%,100%{opacity:1;transform:scale(1)}}

/* cards on the floor */
.card{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;display:grid;gap:12px;box-shadow:0 22px 40px -24px rgba(0,0,0,.75)}
.card p{margin:0}
.card-title{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.len-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.len-btn{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 6px 12px;display:grid;justify-items:center;gap:8px;cursor:pointer;color:var(--ink)}
.len-btn .flip{font-size:36px}
.len-btn span.cap{font-size:12px;font-weight:600;color:var(--muted)}
.len-btn:hover{border-color:var(--ball)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;cursor:pointer;font-size:22px;min-height:52px;color:var(--ink)}
.chip:hover{border-color:var(--ball)}
.chip .colon{font-family:var(--display);font-weight:800;color:var(--muted);font-size:.8em;padding:0 2px}
.chip.text{font-size:14px;font-weight:600;color:var(--ink-2);padding:8px 14px}
.score-in{width:96px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:9px}
.steps li{counter-increment:s;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ball);color:var(--ball-ink);font-weight:700;font-size:12px}
.steps b{color:var(--ink);font-weight:600}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:10px}
.notice p{margin:0;color:var(--ink-2);font-size:14px;max-width:60ch}
.notice .notice-title{font-weight:700;font-size:16px;color:var(--ink)}

/* lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list.empty{padding:16px;color:var(--muted);font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;min-height:54px}
.pos{width:22px;flex:none;text-align:center;font-family:var(--display);font-weight:800;font-size:21px;color:var(--muted);font-variant-numeric:tabular-nums}
.nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm b{font-weight:600}
.rt{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.item .rt:last-child{padding-right:6px}
.row-btn{appearance:none;width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;text-align:left;cursor:pointer;min-height:62px;color:inherit}
.row-btn:hover{background:var(--sunk)}
.rk{width:30px;flex:none;text-align:center;font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.who{flex:1;min-width:0;display:grid;gap:3px}
.who .nm{font-size:16px}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.form{display:inline-flex;gap:3px;align-items:center}
.form i{display:block;width:8px;height:8px;border-radius:50%}
.form i.w{background:var(--win)}
.form i.l{box-shadow:inset 0 0 0 1.6px var(--loss)}
.today{font-weight:600}
.score{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.score sup{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--muted);margin-left:2px;vertical-align:super;line-height:0}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 14px}

<script>
"use strict";
/*<logic>*/
const START = 1000, K_NEW = 40, K_EST = 20, PROVISIONAL = 10, FORMATS = [3, 5, 11], TABLES = [1, 2], IDLE_MS = 10 * 60 * 1000;
function expected(ra, rb) { return 1 / (1 + Math.pow(10, (rb - ra) / 400)); }
function kFor(n) { return n < PROVISIONAL ? K_NEW : K_EST; }
function toInt(v, d) { const n = Number(v); return Number.isFinite(n) ? Math.round(n) : d; }
function listGames(byId) {
  const out = [];
  for (const [id, x] of byId) {
    if (!x || typeof x !== "object") continue;
    if (typeof x.w !== "string" || typeof x.l !== "string" || x.w === x.l) continue;
    const at = Number(x.at);
    if (!Number.isFinite(at)) continue;
    out.push({ id, wk: x.wk || null, w: x.w, l: x.l, ws: toInt(x.ws, 0), ls: toInt(x.ls, 0), t: toInt(x.t, 0), at, v: !!x.v,
      tableNo: toInt(x.tableNo, 0) || null, sessionId: typeof x.sessionId === "string" ? x.sessionId : null, calc: null });
  }
  out.sort((a, b) => a.at - b.at || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  return out;
}
function newStat() { return { r: START, n: 0, w: 0, l: 0, pf: 0, pa: 0, peak: START, cur: 0, best: 0, hist: [], h2h: new Map(), form: [], dayStart: null, lastAt: 0 }; }
function replay(games, todayStart) {
  const P = new Map();
  const st = id => { let s = P.get(id); if (!s) { s = newStat(); P.set(id, s); } return s; };
  for (const g of games) {
    g.calc = null;
    if (g.v) continue;
    const W = st(g.w), L = st(g.l);
    if (todayStart != null && g.at >= todayStart) {
      if (W.dayStart === null) W.dayStart = W.r;
      if (L.dayStart === null) L.dayStart = L.r;
    }
    const e = expected(W.r, L.r), wb = W.r, lb = L.r;
    W.r = wb + kFor(W.n) * (1 - e);
    L.r = lb - kFor(L.n) * (1 - e);
    g.calc = { wb, lb, wa: W.r, la: L.r, dw: Math.round(W.r) - Math.round(wb), dl: Math.round(L.r) - Math.round(lb) };
    W.n++; L.n++; W.w++; L.l++;
    W.pf += g.ws; W.pa += g.ls; L.pf += g.ls; L.pa += g.ws;
    if (W.r > W.peak) W.peak = W.r;
    W.cur = W.cur > 0 ? W.cur + 1 : 1;
    L.cur = L.cur < 0 ? L.cur - 1 : -1;
    if (W.cur > W.best) W.best = W.cur;
    W.hist.push({ r: W.r, g, won: true });
    L.hist.push({ r: L.r, g, won: false });
    const hw = W.h2h.get(g.l) || { w: 0, l: 0 }; hw.w++; W.h2h.set(g.l, hw);
    const hl = L.h2h.get(g.w) || { w: 0, l: 0 }; hl.l++; L.h2h.set(g.w, hl);
    W.form.push(1); L.form.push(0);
    W.lastAt = g.at; L.lastAt = g.at;
  }
  return P;
}
function preview(ra, na, rb, nb) {
  const ea = expected(ra, rb), ka = kFor(na), kb = kFor(nb), R = Math.round;
  return {
    ea,
    aWin: R(ra + ka * (1 - ea)) - R(ra), aLose: R(ra - ka * ea) - R(ra),
    bWin: R(rb + kb * ea) - R(rb), bLose: R(rb - kb * (1 - ea)) - R(rb),
  };
}
function defaultTable(no) { return { no, sessionId: null, startedAt: 0, activeAt: 0, a: null, b: null, queue: [], target: null, streak: 0, rejoin: true }; }
function normalizeTable(x, no) {
  const T = defaultTable(no);
  if (!x || typeof x !== "object") return T;
  T.sessionId = typeof x.sessionId === "string" && x.sessionId ? x.sessionId : null;
  T.startedAt = Number(x.startedAt) || 0;
  T.activeAt = Number(x.activeAt) || 0;
  T.a = typeof x.a === "string" && x.a ? x.a : null;
  T.b = typeof x.b === "string" && x.b && x.b !== T.a ? x.b : null;
  const seen = new Set([T.a, T.b]);
  T.queue = Array.isArray(x.queue) ? x.queue.filter(id => typeof id === "string" && id && !seen.has(id) && (seen.add(id), true)) : [];
  T.target = FORMATS.includes(Number(x.target)) ? Number(x.target) : null;
  T.streak = Math.max(0, toInt(x.streak, 0));
  T.rejoin = x.rejoin !== false;
  return T;
}
function isLive(T, now) { return !!(T && T.sessionId) && now - T.activeAt < IDLE_MS; }
function newSession(no, id, now) { return { ...defaultTable(no), sessionId: id, startedAt: now, activeAt: now }; }
function fillTable(T0) {
  const T = { ...T0, queue: [...T0.queue] };
  if (!T.a && T.b) { T.a = T.b; T.b = null; T.streak = 0; }
  if (!T.a && T.queue.length) { T.a = T.queue.shift(); T.streak = 0; }
  if (!T.b && T.queue.length) T.b = T.queue.shift();
  return T;
}
function advanceTable(T0, side) {
  const winner = T0[side], loser = T0[side === "a" ? "b" : "a"];
  const streak = side === "a" ? T0.streak + 1 : 1;
  const queue = T0.queue.filter(id => id !== winner && id !== loser);
  if (T0.rejoin) queue.push(loser);
  return fillTable({ ...T0, a: winner, b: null, queue, streak, target: null });

function gameLength(ws, target) { return target ? (ws < target ? ws : target) : ws; }
function weekKey(ms) {
  const d = new Date(ms), back = (d.getUTCDay() + 6) % 7;
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back)).toISOString().slice(0, 10);
}
/*</logic>*/

const MINUS = "−", R = Math.round;
const VIEWS = ["tables", "rankings", "games"];
const $ = q => document.querySelector(q);
const S = {
  store: null, kind: null, status: "connecting", writable: null, readOnly: false, signedIn: false, email: null, uid: null,
  players: new Map(), games: new Map(), tables: new Map(TABLES.map(no => [no, defaultTable(no)])),

/* ---------- storage: Claude artifact database ---------- */
function claudeStore(db, user) {
  const known = new Set();
  let unsub = [];
  return {
    kind: "claude",
    async identity() {
      let uid = null, writable = null;
      if (user) {
        try { uid = await user.id(); } catch (_) {}
        try { const [o, e] = await Promise.all([user.isOwner(), user.canEdit()]); writable = !!(o || e); } catch (_) {}
      }
      return { uid, writable, signedIn: true, email: null };
    },
    subscribe(on) {
      unsub.forEach(u => { try { u(); } catch (_) {} });
      unsub = [
        db.collection("players").onSnapshot(snap => {
          const m = new Map();
          for (const d of snap.docs) { const x = d.data(); if (x && typeof x.name === "string" && x.name.trim()) m.set(d.id, { id: d.id, name: cleanName(x.name), archived: !!x.archived, createdAt: Number(x.createdAt) || 0 }); }
          on.players(m);
        }, on.error),
        db.collection("games").onSnapshot(snap => {
          const m = new Map();
          for (const d of snap.docs) {
            known.add(d.id);
            const g = (d.data() || {}).games;
            if (g && typeof g === "object") for (const id of Object.keys(g)) if (g[id] && typeof g[id] === "object") m.set(id, { ...g[id], wk: d.id });
          }
          on.games(m);
        }, on.error),
        db.collection("tables").onSnapshot(snap => {
          const m = new Map();
          for (const d of snap.docs) { const no = Number(d.id); if (TABLES.includes(no)) m.set(no, d.data()); }
          on.tables(m);
        }, on.error),
      ];
    },
    gameKey: (id, g) => "games/" + (g.wk || weekKey(g.at)),
    addPlayer: (id, p) => db.doc("players/" + id).set(Object.assign({ name: p.name, archived: false, createdAt: p.createdAt }, S.uid ? { addedBy: S.uid } : {})),
    updatePlayer: (id, patch) => db.doc("players/" + id).update(patch),
    async addGame(id, g) {
      const wk = g.wk || weekKey(g.at), ref = db.doc("games/" + wk);
      const body = { w: g.w, l: g.l, ws: g.ws, ls: g.ls, t: g.t, at: g.at, tableNo: g.tableNo || null, sessionId: g.sessionId || null };
      if (S.uid) body.by = S.uid;

        const snap = await ref.get();

        known.add(wk);

    },
    removeGame: (id, g) => db.doc("games/" + (g.wk || weekKey(g.at))).update({ games: { [id]: null } }),
    voidGame: (id, g, v) => db.doc("games/" + (g.wk || weekKey(g.at))).update({ games: { [id]: { v } } }),
    setTable: T => db.doc("tables/" + T.no).set({ sessionId: T.sessionId, startedAt: T.startedAt, activeAt: T.activeAt, a: T.a || null, b: T.b || null, queue: T.queue.slice(), target: T.target || null, streak: T.streak, rejoin: T.rejoin, updatedAt: Date.now() }),

  if (!T) return;
  const elsewhere = seated();
  const next = { ...T, queue: T.queue.slice() };
  for (const id of ids) if (id && next.a !== id && next.b !== id && !next.queue.includes(id) && !(elsewhere.has(id) && elsewhere.get(id) !== no)) next.queue.push(id);
  commitTable(fillTable(next));
}
function removeFromQueue(id) { const T = cur(); if (!T) return; commitTable({ ...T, queue: T.queue.filter(x => x !== id) }); }
function moveUp(id) {
  const T = cur(); if (!T) return;
  const q = T.queue.slice(), i = q.indexOf(id);
  if (i > 0) { [q[i - 1], q[i]] = [q[i], q[i - 1]]; commitTable({ ...T, queue: q }); }
}
function setTarget(n) {
  const T = cur(); if (!T || T.target === n) return;
  S.pick = null; S.custom = null;
  commitTable({ ...T, target: n });
}
function setRejoin(v) { const T = cur(); if (T) commitTable({ ...T, rejoin: !!v }); }
async function addPlayer(raw) {
  const nm = cleanName(raw);
  if (!nm) return { error: "Type a name first." };
  const clash = [...S.players.values()].find(p => norm(p.name) === norm(nm));
  if (clash) return { error: clash.archived ? clash.name + " is archived. Open them from Rankings to bring them back." : clash.name + " is already on the ladder." };
  const id = newId("p"), createdAt = Date.now();
  S.players.set(id, { id, name: nm, archived: false, createdAt });
  schedule(true);
  try { await enqueue("player:" + id, () => withRetry(() => S.store.addPlayer(id, { name: nm, createdAt }))); return { id, name: nm }; }
  catch (e) { S.players.delete(id); schedule(true); writeFailed(e, nm + " wasn’t added."); return { error: nm + " wasn’t added. Try again." }; }
}
async function saveRename(sh) {
  const nm = cleanName(sh.draft);
  if (!nm) { sh.err = "Type a name first."; updateSheet(true); return; }
  const clash = [...S.players.values()].find(p => p.id !== sh.id && norm(p.name) === norm(nm));
  if (clash) { sh.err = clash.name + " is already on the ladder."; updateSheet(true); return; }
  try {
    await enqueue("player:" + sh.id, () => withRetry(() => S.store.updatePlayer(sh.id, { name: nm })));
    const p = S.players.get(sh.id); if (p) S.players.set(sh.id, { ...p, name: nm });
    sh.editing = false; sh.err = ""; schedule(true); updateSheet(true);
  } catch (e) { writeFailed(e, "The new name wasn’t saved."); }
}
async function setArchived(id, flag) {
  const nm = nameOf(id);
  try {
    await enqueue("player:" + id, () => withRetry(() => S.store.updatePlayer(id, { archived: flag })));
    const p = S.players.get(id); if (p) S.players.set(id, { ...p, archived: flag });
    schedule(true);
    if (flag) {
      for (const no of TABLES) {
        const T = liveOf(no);
        if (T && (T.a === id || T.b === id || T.queue.includes(id))) commitTable({ ...T });
      }
      closeSheet();
    } else if (S.sheet) { S.sheet.confirmArchive = false; updateSheet(true); }
    showToast({ text: flag ? nm + " archived. Their games still count." : nm + " is back on the ladder." });
  } catch (e) { writeFailed(e, "That change wasn’t saved."); }
}

/* ---------- keep the screen on ---------- */
function wakePref() { try { return localStorage.getItem("wso.wake") === "1"; } catch (_) { return false; } }
function saveWake(on) { try { localStorage.setItem("wso.wake", on ? "1" : "0"); } catch (_) {} }
async function acquireWake(asked) {
  if (!("wakeLock" in navigator) || wakeLock || document.visibilityState !== "visible") return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; rerender(); });
  } catch (_) {
    wakeLock = null;
    if (asked) { saveWake(false); showToast({ text: "This browser won’t keep the screen on here." }); }
  }
  rerender();
}
async function setWake(on) {
  saveWake(on);
  if (on) { await acquireWake(true); return; }
  const l = wakeLock; wakeLock = null;
  try { if (l) await l.release(); } catch (_) {}
  rerender();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wakePref()) acquireWake(false); });

/* ---------- toast ---------- */
function showToast(t) {
  S.toast = t;
  clearTimeout(toastTimer);
  renderToast();
  toastTimer = setTimeout(hideToast, t.undo ? 9000 : 4500);
}
function hideToast() { clearTimeout(toastTimer); S.toast = null; renderToast(); }
function renderToast() {
  const root = $("#toast"), t = S.toast;
  if (!t) { root.replaceChildren(); return; }
  root.replaceChildren(h("div", { class: "toast-card" }, h("p", { text: t.text }),
    t.undo && h("button", { type: "button", class: "btn", id: "toast-undo", onclick: () => { const u = t.undo; hideToast(); u(); } }, "Undo")));
}

/* ---------- connection ---------- */
const on = {
  players(m) { S.players = m; S.loaded.players = true; schedule(true); },
  games(m) { S.games = m; S.loaded.games = true; schedule(true); },
  tables(m) {
    S.tables = new Map(TABLES.map(no => [no, normalizeTable(m.get(no), no)]));
    afterTables(); S.loaded.tables = true; schedule(false);
  },
  patchPlayer(id, row) { if (row) S.players.set(id, row); else S.players.delete(id); schedule(true); },
  patchGame(id, row) { if (row) S.games.set(id, row); else S.games.delete(id); schedule(true); },
  patchTable(no, row) { if (TABLES.includes(no)) { S.tables.set(no, normalizeTable(row, no)); afterTables(); schedule(false); } },
  error(e) {
    const code = e && e.code;
    if (code === "unavailable" && S.retries < 5) { S.retries++; setTimeout(() => S.store.subscribe(on), 2000 + Math.random() * 2000); return; }
    if (code === "revoked") { S.readOnly = true; rerender(); return; }
    S.status = "offline"; rerender();
  },
};
function afterTables() {
  const T = cur();
  if (S.pick && !(T && T.a && T.b && T.target)) { S.pick = null; S.custom = null; }
  if (S.confirmEnd && !T) S.confirmEnd = false;
}
async function refreshIdentity() {
  try {
    const id = await S.store.identity();
    S.uid = id.uid; S.writable = id.writable; S.signedIn = id.signedIn; S.email = id.email; S.readOnly = false;
  } catch (_) { if (S.kind === "supabase") S.writable = false; }
  if (S.sheet && S.sheet.type === "signin" && S.signedIn) closeSheet();
  rerender();
}
async function connect() {
  const cfg = window.WSO_CONFIG;
  try {
    if (cfg && cfg.supabaseUrl && cfg.supabaseKey && window.supabase && window.supabase.createClient) {
      S.store = supaStore(window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey));
      S.store.onAuth(refreshIdentity);
    } else if (!cfg && window.claude && typeof window.claude.use === "function") {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (db) S.store = claudeStore(db, user);
    }
  } catch (_) { S.store = null; }
  if (!S.store) { S.status = "offline"; rerender(); return; }
  S.kind = S.store.kind;
  await refreshIdentity();
  S.status = "ready";
  S.store.subscribe(on);
  rerender();
}

/* ---------- boot ---------- */
for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => setView(b.dataset.view));
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) { e.preventDefault(); closeSheet(); } });
setInterval(() => { if (S.view === "tables" && document.visibilityState === "visible" && !S.sheet) { afterTables(); rerender(); } }, 15000);
function start(data) {
  const hash = (location.hash || "").slice(1);
  const m = /^table(\d)$/.exec(hash);
  if (m && TABLES.includes(Number(m[1]))) { S.view = "tables"; S.current = Number(m[1]); }
  else if (VIEWS.includes(hash)) S.view = hash;
  else if (data && VIEWS.includes(data.view)) { S.view = data.view; S.current = data.current || null; }
  else { try { const saved = localStorage.getItem("wso.view"); if (VIEWS.includes(saved)) S.view = saved; } catch (_) {} }
  render();
  connect();
  if (wakePref()) acquireWake(false);
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ view: S.view, current: S.current })); } catch (_) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
</body>
</html>
